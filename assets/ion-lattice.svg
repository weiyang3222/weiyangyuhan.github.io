<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Protonation in a corner-sharing metal–oxygen octahedral network</title>
<desc id="diagram-desc">Two idealized MO6 octahedra share one oxygen vertex. Each transition-metal M centre is coordinated by six oxygen atoms. A small hydrogen is bonded to the shared lattice oxygen. The proton pathway ends at this O–H configuration, while a separate electron-transfer arrow ends in the metal–oxygen electronic-state region. A-site cations are omitted. This is an original, literature-informed local structural schematic, not an exact crystallographic model or experimental data.</desc>
